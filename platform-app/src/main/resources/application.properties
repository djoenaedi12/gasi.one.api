spring.application.name=platform-app
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/platform-app

# PF4J plugin directory. Also read before Spring starts via APP_PLUGINS_PATH or -Dapp.plugins.path.
app.plugins.path=${APP_PLUGINS_PATH:plugins}

# Database
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/gasi_one}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=${DB_USERNAME:gasi}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate schema is managed by Flyway.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# Flyway is managed by PluginFlywayConfig so platform and plugin migrations run together.
spring.flyway.enabled=false
spring.flyway.table=schema_histories

# Keep accidental bean-name collisions visible. Use @Primary, @ConditionalOnMissingBean,
# or explicit bean names for intentional plugin overrides.
spring.main.allow-bean-definition-overriding=false

# Cache
spring.cache.type=caffeine
spring.cache.caffeine.spec=maximumSize=1000,expireAfterWrite=30m

# Public ID encoding (Sqids alphabet).
app.id.salt=${APP_ID_SALT:abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789}

# Field-level encryption (AES-GCM). Enable only after setting a Base64 AES key.
# Generate key example: openssl rand -base64 32
app.field-encryption.enabled=${APP_FIELD_ENCRYPTION_ENABLED:false}
app.field-encryption.key=${APP_FIELD_ENCRYPTION_KEY:}

# Security plugin defaults.
auth.jwt.secret=${AUTH_JWT_SECRET:}
app.security.cors.allowed-origins=http://localhost:3000,http://localhost:5173
app.security.cors.allowed-methods=GET,POST,PUT,DELETE
app.security.cors.allowed-headers=Authorization,Content-Type,X-API-Key,X-Device-Id,X-Device-Model
app.security.cors.exposed-headers=Authorization
app.security.cors.allow-credentials=true
app.security.cors.max-age=86400
